# 研究方向（建议不超过 4 个），order 决定显示顺序
# 页面上显示：title（标题）、summary（简介）、keywords（关键词，也会出现在首页滚动条中）
# 配图按 id 对应 src/components/research/art/LineArt.astro 中的线稿；新增方向时需在其中补画一幅
# details（详细介绍）与 pubs（相关论文 id）目前不在页面上显示，作为资料保留，之后需要时可再启用

- id: ehr-prediction
  order: 1
  title: { zh: 电子病历智能诊断与预测, en: EHR-Based Clinical Diagnosis and Prediction }
  summary:
    zh: 面向真实世界电子病历数据，研究临床信息抽取、医学知识建模与疾病风险预测方法，构建可解释的辅助诊断与预后预测模型，并结合联邦学习支持多中心数据的隐私保护协同建模。
    en: We develop methods for clinical information extraction, medical knowledge modeling and disease risk prediction on real-world EHR data, build interpretable models for diagnostic support and prognosis, and use federated learning for privacy-preserving multi-center modeling.
  details:
    zh: 研究内容包括中文电子病历临床事件抽取、糖尿病中文医学本体构建，儿童青少年原发性高血压、COVID-19 预后等疾病的风险预测模型，以及基于联邦学习的多中心协同建模。
    en: Our work includes clinical event extraction from Chinese EHRs, a Chinese medical ontology for diabetes, risk prediction models for conditions such as pediatric primary hypertension and COVID-19 outcomes, and federated learning for multi-center collaborative modeling.
  keywords: [EHR, Clinical Prediction, Diagnostic Support, Federated Learning]
  pubs: [jmir-2024-hypertension, tiis-2024-fl-covid, bmc-2024-ontology]

- id: virtual-patient
  order: 2
  title: { zh: 大模型虚拟患者, en: Virtual Patients Powered by Large Language Models }
  summary:
    zh: 研究基于真实病例的大语言模型虚拟患者生成方法，关注病例驱动的角色建模、多轮问诊中的角色一致性与幻觉抑制，以及问诊能力的自动化评估，服务于医学教育与临床技能训练。
    en: We study LLM-based virtual patients grounded in real clinical cases, focusing on case-driven persona modeling, persona consistency and hallucination control in multi-turn interviews, and automated assessment of history-taking skills for medical education and clinical training.
  details:
    zh: 我们以精神科为切入点，构建按 ICD-10 分类的结构化病例库（覆盖抑郁症、焦虑症、双相情感障碍等），由大语言模型扮演患者，模拟不同疾病的情绪状态与语言特点；学员可通过语音与虚拟患者对话完成问诊，给出诊断后系统自动评估诊断准确性、病史采集完整性与治疗建议合理性。同时通过角色约束与病例数据检索抑制模型幻觉，保证对话的医学真实性与角色一致性。
    en: Starting with psychiatry, we build a structured case library classified by ICD-10 (covering depression, anxiety, bipolar disorder and more), in which an LLM plays the patient and simulates the emotional states and speech patterns of each condition. Trainees interview the virtual patient by voice; once they give a diagnosis, the system automatically assesses diagnostic accuracy, completeness of history taking and appropriateness of treatment suggestions. Persona constraints and case-data retrieval are used to suppress hallucination and keep the dialogue medically realistic and in character.
  keywords: [Virtual Patient, Medical Education, Psychiatry]

- id: health-qa
  order: 3
  title: { zh: 大语言模型健康问答, en: LLM-Powered Health Question Answering }
  summary:
    zh: 研究面向公众的中文健康问答大模型：基于真实场景中的提问构建专家校准的问答数据集，通过领域微调提升模型在敏感健康话题上的准确性、安全性及对口语化提问的鲁棒性，当前聚焦青少年生殖健康。
    en: We study Chinese health QA models for the public, building expert-calibrated QA datasets from real-world questions and using domain fine-tuning to improve accuracy, safety and robustness to colloquial queries on sensitive health topics, currently focusing on adolescent reproductive health.
  details:
    zh: 我们从视频平台的评论与弹幕中提取青少年和年轻用户自发提出的生殖健康问题，构建经临床专家校准的中文问答数据集，并对开源中文大模型进行领域微调，提升其在避孕、人工流产等敏感话题上回答的准确性与安全性，以及对口语化提问的鲁棒性。
    en: We extract reproductive health questions posted spontaneously by adolescents and young users in video-platform comments and danmaku, build a clinician-calibrated Chinese QA dataset, and fine-tune open-source Chinese LLMs to answer sensitive topics such as contraception and induced abortion more accurately and safely, and to handle colloquial questions robustly.
  keywords: [Health QA, Domain Fine-tuning, Reproductive Health]

- id: llm-bias
  order: 4
  title: { zh: 大语言模型偏见与可信评估, en: Bias and Trustworthiness of Medical LLMs }
  summary:
    zh: 建立医疗场景下大语言模型的评估框架，系统考察模型输出的准确性、一致性、稳定性与人口学偏见，为大模型在医疗领域的安全、公平应用提供证据。
    en: We build evaluation frameworks for LLMs in healthcare, systematically examining the accuracy, consistency, stability and demographic bias of model outputs to provide evidence for their safe and fair use in medicine.
  details:
    zh: 我们比较不同大语言模型生成合成电子病历的完整性与性别、种族分布偏差，并评估大模型辅助数据标注的准确性、一致性与稳定性。
    en: We compare the completeness and gender and ethnicity bias of synthetic EHRs generated by different LLMs, and assess the accuracy, consistency and stability of LLM-assisted data annotation.
  keywords: [LLM Evaluation, Bias, Fairness]
  pubs: [jmir-2025-llm-ehr, jmir-2026-autism-llm]
