- id: ruochen-huang
  role: pi
  name: { zh: 黄若尘, en: Ruochen Huang }
  aliases: [R Huang]
  avatar: /people/ruochen-huang.webp
  # TODO: 职称待确认
  title: { zh: 南京医科大学 · 青年教师, en: Faculty Member · Nanjing Medical University }
  interests:
    zh: 电子病历智能诊断与预测、大模型虚拟患者、大语言模型健康问答、医疗大模型偏见与可信评估
    en: "EHR-based clinical diagnosis and prediction, LLM-powered virtual patients, LLM-based health question answering, bias and trustworthiness of medical LLMs"
  bio:
    zh: 南京医科大学青年教师，长期从事人工智能与医学的交叉研究，主要方向包括基于电子病历的智能诊断与预测、大语言模型驱动的虚拟患者、面向青少年生殖健康等领域的健康问答大模型，以及医疗大模型的偏见与可信评估。已在 Journal of Medical Internet Research、IEEE Internet of Things Journal 等期刊和国际会议发表论文 30 余篇。
    en: Ruochen Huang is a faculty member at Nanjing Medical University working at the intersection of artificial intelligence and medicine, with a focus on clinical diagnosis and prediction based on electronic health records, virtual patients powered by large language models, health question-answering LLMs for areas such as adolescent reproductive health, and bias and trustworthiness evaluation of medical LLMs. Ruochen has published over 30 papers in journals and conferences including the Journal of Medical Internet Research and the IEEE Internet of Things Journal.
  email: huangrc@njmu.edu.cn
  homepage: https://scholar.google.com/citations?user=DCDjlOYAAAAJ
