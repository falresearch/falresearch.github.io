<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="b-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <radialGradient id="b-tube" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ff7a1f" stop-opacity="0.28" />
      <stop offset="1" stop-color="#140e0a" stop-opacity="1" />
    </radialGradient>
    <pattern id="b-mesh" width="3" height="3" patternUnits="userSpaceOnUse">
      <path d="M0 0 H3 M0 0 V3" stroke="#ff9a4a" stroke-opacity="0.18" stroke-width="0.5" />
    </pattern>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#0b0d10" stroke="#ffffff" stroke-opacity="0.14" />
  <!-- 玻璃管 -->
  <path d="M18 54 V 18 a14 14 0 0 1 28 0 V 54 Z" fill="url(#b-tube)" stroke="#ffb27a" stroke-opacity="0.45" stroke-width="1.2" />
  <path d="M18 54 V 18 a14 14 0 0 1 28 0 V 54 Z" fill="url(#b-mesh)" />
  <path d="M22 20 a10 10 0 0 1 6 -8" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.4" stroke-linecap="round" />
  <!-- 发光灯丝：F -->
  <g stroke="#ffb36b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#b-glow)">
    <path d="M27 46 V 18 H 38" />
    <path d="M27 31 H 35" />
  </g>
  <!-- 电路焊盘 -->
  <g fill="#ffd2a8">
    <circle cx="38" cy="18" r="1.8" />
    <circle cx="35" cy="31" r="1.8" />
  </g>
  <!-- 底座与引脚 -->
  <rect x="16" y="52" width="32" height="5" rx="1.5" fill="#1c1f24" stroke="#ffffff" stroke-opacity="0.2" />
  <g stroke="#e9ebee" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round">
    <path d="M23 57 v3 M29 57 v3 M35 57 v3 M41 57 v3" />
  </g>
  <!-- 小数点（黄绿） -->
  <circle cx="51" cy="50" r="2.6" fill="#c8f031" filter="url(#b-glow)" />
</svg>
